# Disable USB autosuspend globally, before any USB device probes.
#
# Belt-and-braces for 99-usb-no-autosuspend.rules. That udev rule sets
# power/control=on per device, but only for devices that actually match and get
# processed; this sets the usbcore DEFAULT so a device is never autosuspend-
# eligible in the first place. systemd-tmpfiles-setup runs at sysinit.target,
# long before the r8152 dongle enumerates (~t=21s), so the default is already in
# place when it appears.
#
# Rationale in full is in 99-usb-no-autosuspend.rules: autosuspend is what makes
# the dongle drop off the bus (Tx timeout -> Tx status -2 -> USB disconnect),
# taking the device's only network path with it.
#
# Debian's default is 2 (seconds). -1 disables it.
w /sys/module/usbcore/parameters/autosuspend - - - - -1
