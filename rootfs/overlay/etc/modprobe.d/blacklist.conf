# bcmdhd4389: Broadcom WiFi driver crashes on boot on this device.
# exynos_mfc: Samsung multi-format codec driver crashes on boot.
# exynos_seclog: TrustZone secure-log driver, implicated in the intermittent
#   boot-time panic in add_uevent_var. Across 8 consecutive boots of
#   1.4.0-g2b7cf3f, the 3 boots that logged "probe of seclog failed with error
#   -22" all panicked and the 5 that never mentioned seclog were all clean. The
#   panic dereferences an unmapped vmalloc address as the "%s" of SUBSYSTEM=,
#   and seclog's failure path is the one vunmap() of a vmalloc region in the
#   log. We do not use secure logging, so it costs nothing to drop.
# Also filtered out of the dracut --force-drivers list in the Makefile so the
# initramfs doesn't load them before modprobe.d is consulted.
blacklist bcmdhd4389
blacklist exynos_mfc
blacklist exynos_seclog
