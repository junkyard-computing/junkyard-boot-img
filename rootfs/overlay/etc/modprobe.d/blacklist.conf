# bcmdhd4389: Broadcom WiFi driver crashes on boot on this device.
# exynos_mfc: Samsung multi-format codec driver crashes on boot.
#
# NOT blacklisted: exynos_seclog. It was, briefly, on the theory that it caused
# the boot-time add_uevent_var panic (3 of 8 boots logged "probe of seclog
# failed with error -22" and exactly those 3 panicked). That correlation was
# FALSE — with seclog blacklisted and verified unloaded, the identical panic
# recurred with the same faulting address. Don't re-add it on that reasoning.
#
# Also filtered out of the dracut --force-drivers list in the Makefile so the
# initramfs doesn't load them before modprobe.d is consulted.
blacklist bcmdhd4389
blacklist exynos_mfc

# NFC controller. Some units' st21nfc does not answer cleanly on i2c and its
# probe wedges a udev worker; when that happens inside the initramfs,
# dracut-initqueue loops on "Timed out while waiting for udev queue to empty"
# and the device sits on the bootloader splash for ~10 minutes looking bricked.
# Measured on 34291FDHS000WV: 500+s to boot vs 13.0s for the same image on
# 35041FDHS0032G. These devices never use NFC. Also stripped from
# module_order.txt so dracut does not force-load it before this file applies.
blacklist st21nfc
