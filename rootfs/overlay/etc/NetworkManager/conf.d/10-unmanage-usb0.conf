# Keep NetworkManager off the USB gadget interface.
#
# /etc/NetworkManager/system-connections/default_connection.nmconnection is a
# WILDCARD ethernet profile — it sets no ifname, so it matches any ethernet
# device, usb0 included. Left alone, NM would claim usb0, run DHCP on a
# point-to-point cable that has no DHCP server, time out, and deactivate the
# device — flushing the static address usb_gadget just set.
#
# usb0 is not a general-purpose NIC: it is one cable to one host PC, statically
# addressed 10.42.0.1/24 by /usr/local/sbin/usb_gadget. Single owner, no
# negotiation, so hand it to that script outright.
[keyfile]
unmanaged-devices=interface-name:usb0
