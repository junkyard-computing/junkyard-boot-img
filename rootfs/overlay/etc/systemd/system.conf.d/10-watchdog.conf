# Point PID1's runtime watchdog at SOFTDOG with a 120s grace, NOT the s3c2410
# hardware watchdog.
#
# The 15s s3c2410 HW watchdog rebooted a HEALTHY device on USB-C cable replug:
# moving the cable stalls PID1's main loop past 15s during the .device-unit
# uevent flood, so the watchdog reset out from under a fine kernel. 15s is below
# what normal cable churn does. (The AOSP track saw the same thing --
# project_felix_softdog_false_crashes -- but there /dev/watchdog0 was already
# softdog; here it is the HW watchdog, whose ~15s HW max can't be stretched.)
#
# softdog is a plain kernel timer with no HW ceiling, so 120s is honoured. A
# permanently wedged PID1 still self-recovers (this device has no screen or
# buttons). Real KERNEL hangs -- which softdog cannot catch, being a kernel timer
# itself -- are covered instead by the buddy hardlockup detector with panic baked
# in (CONFIG_BOOTPARAM_HARDLOCKUP_PANIC, see kernel/custom_defconfig_mod/felix.config).
#
# WatchdogDevice pins the softdog node via a stable udev symlink
# (99-softdog-symlink.rules), because softdog vs s3c2410 device numbering
# (watchdog0/watchdog1) is not guaranteed stable across boots.
[Manager]
RuntimeWatchdogSec=120s
WatchdogDevice=/dev/watchdog-soft
