# Arm the gs201 hardware watchdog. PID1 pings /dev/watchdog every
# RuntimeWatchdogSec/2; if it stops, the PMU resets the SoC.
#
# NOT optional on the shipped configuration: the device has no screen, no
# volume keys and no power button, so a kernel or PID1 hang would otherwise be
# permanent and unrecoverable in the field. Kernel support is present
# (CONFIG_S3C2410_WATCHDOG_GS=m, CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y). If the
# device node never appears systemd logs a warning and continues, so this is
# inert rather than harmful in that case.
#
# RebootWatchdogSec bounds the OTHER half: the window between systemd starting to
# shut down and the machine actually resetting. systemd's default is 10min,
# which on a unit with no buttons is the difference between a blip and something
# a human writes off as bricked.
#
# 60s is chosen against measurement, not taste. Across ~20 instrumented reboots
# on 34291FDHS000WV a normal shutdown takes 13-17s wall (bootloader is a
# separate, rock-steady 17.16s). But this path intermittently stalls for a
# silent ~42s at a time, and was observed stalling twice and three times in one
# shutdown (96s / 138s / 180s cycles). The stall is NOT systemd job management —
# it does not scale with DefaultTimeoutStopSec (a 5s timeout produced an
# identical 96.4s stall) — so it is almost certainly a driver .shutdown callback
# blocking on a hardware timeout, and systemd's own timeouts cannot bound it.
#
# 60s therefore sits above every legitimate shutdown and above a single stall,
# while still recovering a genuinely hung shutdown in a minute instead of ten.
# A device that resets 43s "early" loses nothing: it was going to reset anyway.
[Manager]
RuntimeWatchdogSec=15s
RebootWatchdogSec=60s
