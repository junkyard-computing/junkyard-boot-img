# Arm the gs201 hardware watchdog (15s hw max) so post-boot hangs auto-reset.
# systemd (PID1) pings /dev/watchdog every RuntimeWatchdogSec/2; on a hang the
# s3c2410_wdt PMU reset fires.
#
# The AOSP kernel build has CONFIG_S3C2410_WATCHDOG_GS=m and
# CONFIG_WATCHDOG_HANDLE_BOOT_ENABLED=y, so the device node should appear once
# the module loads. If it does not, systemd logs a warning and continues — this
# drop-in is inert rather than harmful in that case.
[Manager]
RuntimeWatchdogSec=15s
