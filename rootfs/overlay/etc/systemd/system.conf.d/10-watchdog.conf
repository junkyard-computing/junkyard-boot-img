# ⚠ RuntimeWatchdogSec=15s WAS THE SINGLE LARGEST SOURCE OF "CRASHES" ON THIS
# IMAGE. Measured 2026-08-02: of 11 archived pstore records, SEVEN were
# "softdog: Initiating system reboot" and only four were real kernel oopses.
# The device was healthy every one of those seven times.
#
# Why it misfires. systemd binds to /dev/watchdog0, and on this device that is
# **softdog — the SOFTWARE watchdog**, not the gs201 hardware one. systemd's own
# log says so: "Using hardware watchdog 'Software Watchdog', version 0, device
# /dev/watchdog0". PID1 must ping it every RuntimeWatchdogSec/2 or the box is
# force-restarted. A USB attach (plugging the ethernet dongle in) stalls
# userspace longer than 15s on this hardware, so simply moving the cable
# rebooted the machine — reproducibly. Captured: dongle enumerates at t=1208,
# carrier on at t=1211.7, kernel still logging normally at t=1220.7, then
#   [ 1222.037408] softdog: Initiating system reboot
# The bootloader records that as `0xbaba - Kernel PANIC`, which is why it looked
# like a crash for most of a day.
#
# It also protects far less than it appears to. softdog is driven by a KERNEL
# TIMER, so a genuinely hung kernel never gets reset by it — it only catches
# userspace stalls, which are usually transient and self-clearing. Real kernel
# hangs are already covered on this image, independently:
#   * hardlockup-watchdog (AOSP), sampling 4s, panic=1
#   * CONFIG_PANIC_ON_OOPS=y + CONFIG_PANIC_TIMEOUT=-1 -> immediate reboot
#
# 120s, not 15s and not off. Off would leave a permanently wedged userspace
# unrecoverable on a unit with no screen and no buttons, which is the case this
# was added for. 120s clears the measured USB-attach stall by a wide margin
# while still rescuing a truly stuck PID1 in two minutes.
#
# If you want real hardware-watchdog coverage, point systemd at the s3c2410
# device explicitly (WatchdogDevice=) rather than letting it grab watchdog0 —
# but verify which node is which first, and re-measure, because binding a
# hardware watchdog to a 15s timeout would reboot on the same stalls with less
# ceremony.
[Manager]
RuntimeWatchdogSec=120s

# RebootWatchdogSec bounds the OTHER half: systemd starting to shut down vs the
# machine actually resetting. systemd's default is 10min, which on a unit with
# no buttons is the difference between a blip and something a human writes off
# as bricked. Measured across ~20 instrumented reboots: a normal shutdown is
# 13-17s wall (the bootloader is a separate, rock-steady 17.16s). 60s clears
# every legitimate shutdown while still recovering a hung one in a minute.
RebootWatchdogSec=60s
